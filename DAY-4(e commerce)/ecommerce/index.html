<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThinkSmart - Login</title>

    <link rel="stylesheet" href="styles/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

<header>
    <nav class="navbar">

        <a href="Home-Page.html" class="logo">
            <img src="images/logo.png" alt="ThinkSmart Logo">
        </a>

        <ul class="nav-links">
            <li><a href="Home-Page.html">Home</a></li>
            <li><a href="Products.html">Products</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Contact.html">Contact</a></li>
            <li><a href="Cart.html">🛒 Cart</a></li>
        </ul>

        <a href="Register-Page.html" class="nav-btn">Register</a>

    </nav>
</header>


<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">🛍️</div>

        <h1>Welcome Back!</h1>

        <p>Login to your ThinkSmart account</p>


        <form>

            <label>Email Address</label>

            <input type="email"
                   placeholder="Enter your email"
                   required>


            <label>Password</label>

            <input type="password"
                   placeholder="Enter your password"
                   required>


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>


            <button type="submit" class="main-btn">
                Login
            </button>

        </form>


        <p class="account-text">
            Don't have an account?
            <a href="Register-Page.html">
                Create Account
            </a>
        </p>

    </div>

</section>


<footer>

    <p>© 2026 ThinkSmart. All Rights Reserved.</p>

</footer>

</body>
</html>
